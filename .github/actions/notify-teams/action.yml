name: Notify Teams
description: >
  Best-effort post of a message to a Teams webhook. Plain text is sent as a
  single-block Adaptive Card; a message that is already a JSON object is sent
  as-is.
  An empty webhook URL skips the post, and a failed post only leaves a
  step-summary note: a notification never fails the calling job.

inputs:
  webhook-url:
    description: "Teams incoming webhook URL. Empty skips the notification."
    required: true
  message:
    description: "Plain text, or a complete JSON object payload"
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        WEBHOOK_URL: ${{ inputs.webhook-url }}
        MESSAGE: ${{ inputs.message }}
      run: bash "${{ github.action_path }}/notify.sh"
